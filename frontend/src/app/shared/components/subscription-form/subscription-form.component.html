<form [formGroup]="subscriptionForm" (ngSubmit)="save()" class="space-y-4">
  <div class="space-y-1">
    <label class="text-xs font-bold uppercase text-slate-500">Nome do Serviço</label>
    <input type="text" formControlName="name" placeholder="Ex: Netflix, Spotify..." class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary-light outline-none dark:text-white transition-all">
  </div>
  <div class="grid grid-cols-2 gap-4">
    <div class="space-y-1">
      <label class="text-xs font-bold uppercase text-slate-500">Valor</label>
      <input type="number" formControlName="amount" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary-light outline-none dark:text-white transition-all">
    </div>
    <div class="space-y-1">
      <label class="text-xs font-bold uppercase text-slate-500">Frequência</label>
      <select formControlName="frequency" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary-light outline-none dark:text-white transition-all">
        <option value="MONTHLY">Mensal</option>
        <option value="YEARLY">Anual</option>
      </select>
    </div>
  </div>
  <div class="space-y-1">
    <input type="date" formControlName="nextBillingDate" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary-light outline-none dark:text-white transition-all">
  </div>
  <div class="space-y-1" *ngIf="isEditMode">
    <label class="text-xs font-bold uppercase text-slate-500">Status</label>
    <select formControlName="status" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary-light outline-none dark:text-white transition-all">
      <option value="ACTIVE">Ativo</option>
      <option value="PAUSED">Pausado</option>
      <option value="PAID">Pago</option>
      <option value="CANCELED">Cancelado</option>
    </select>
  </div>
  <div class="flex gap-3 pt-4">
    <button type="button" (click)="cancel()" class="flex-1 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-800 text-sm font-bold text-slate-500">Cancelar</button>
    <button type="submit" [disabled]="subscriptionForm.invalid" class="flex-1 px-4 py-3 rounded-xl bg-primary-light text-white text-sm font-bold shadow-lg shadow-primary-light/20">Salvar Assinatura</button>
  </div>
</form>
