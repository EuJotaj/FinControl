<form [formGroup]="cardForm" (ngSubmit)="save()" class="space-y-4">
  <div class="grid grid-cols-2 gap-4">
    <div class="space-y-1">
      <label class="text-xs font-bold uppercase text-slate-500">Instituição</label>
      <select formControlName="bank" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary-light outline-none dark:text-white transition-all">
        <option *ngFor="let b of banks" [value]="b">{{ b }}</option>
      </select>
    </div>
    <div class="space-y-1">
      <label class="text-xs font-bold uppercase text-slate-500">Últimos 4 Dígitos</label>
      <input type="text" formControlName="lastDigits" maxlength="4" placeholder="1234" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary-light outline-none dark:text-white transition-all">
    </div>
  </div>
  
  <div class="grid grid-cols-2 gap-4">
    <div class="space-y-1">
      <label class="text-xs font-bold uppercase text-slate-500">Limite Total</label>
      <input type="number" formControlName="limit" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary-light outline-none dark:text-white transition-all">
    </div>
    <div class="space-y-1">
      <label class="text-xs font-bold uppercase text-slate-500">Cor do Cartão</label>
      <select formControlName="color" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary-light outline-none dark:text-white transition-all">
        <option *ngFor="let c of colors" [value]="c" [style.color]="c">Cor personalizada</option>
      </select>
    </div>
  </div>

  <div class="flex gap-3 pt-4">
    <button type="button" (click)="cancel()" class="flex-1 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-800 text-sm font-bold text-slate-500">Cancelar</button>
    <button type="submit" [disabled]="cardForm.invalid" class="flex-1 px-4 py-3 rounded-xl bg-primary-light text-white text-sm font-bold shadow-lg shadow-primary-light/20">Salvar Cartão</button>
  </div>
</form>
