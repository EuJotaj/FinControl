<form [formGroup]="transactionForm" (ngSubmit)="save()" class="space-y-5">
  <div class="space-y-1.5">
    <label class="text-xs font-bold uppercase tracking-wider text-slate-500">Descrição</label>
    <input type="text" formControlName="description" placeholder="Ex: Mercado, Uber, Salário..." 
           class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary-light outline-none dark:text-white transition-all">
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div class="space-y-1.5">
      <label class="text-xs font-bold uppercase tracking-wider text-slate-500">Valor</label>
      <div class="relative">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm">R$</span>
        <input type="number" formControlName="amount" step="0.01" 
               class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl pl-10 pr-4 py-3 text-sm focus:ring-2 focus:ring-primary-light outline-none dark:text-white transition-all">
      </div>
    </div>
    
    <div class="space-y-1.5">
      <label class="text-xs font-bold uppercase tracking-wider text-slate-500">Tipo</label>
      <select formControlName="type" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary-light outline-none dark:text-white transition-all">
        <option value="EXPENSE">Despesa</option>
        <option value="INCOME">Receita</option>
      </select>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div class="space-y-1.5">
      <label class="text-xs font-bold uppercase tracking-wider text-slate-500">Categoria</label>
      <select formControlName="categoryId" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary-light outline-none dark:text-white transition-all">
        <option value="">Selecione...</option>
        <ng-container *ngIf="categories$ | async as categories">
          <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
        </ng-container>
      </select>
    </div>

    <div class="space-y-1.5">
      <label class="text-xs font-bold uppercase tracking-wider text-slate-500">Data</label>
      <input type="date" formControlName="date" 
             class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary-light outline-none dark:text-white transition-all">
    </div>
  </div>

  <div class="space-y-1.5" *ngIf="transactionForm.get('type')?.value === 'EXPENSE'">
    <label class="text-xs font-bold uppercase tracking-wider text-slate-500">Cartão de Crédito (Opcional)</label>
    <select formControlName="cardId" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary-light outline-none dark:text-white transition-all">
      <option value="">Nenhum / Dinheiro</option>
      <ng-container *ngIf="cards$ | async as cards">
        <option *ngFor="let card of cards" [value]="card.id">{{ card.bank }} (Final {{ card.lastDigits }})</option>
      </ng-container>
    </select>
  </div>

  <div *ngIf="error" class="bg-rose-50 dark:bg-rose-500/10 text-rose-600 dark:text-rose-400 p-3 rounded-xl text-sm mb-4">
    {{ error }}
  </div>

  <div class="flex gap-3 pt-4">
    <button type="button" (click)="cancel()" class="flex-1 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-800 text-sm font-bold text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800 transition-all" [disabled]="isSaving">
      Cancelar
    </button>
    <button type="submit" [disabled]="transactionForm.invalid || isSaving" class="flex-1 px-4 py-3 rounded-xl bg-primary-light hover:bg-primary-dark text-white text-sm font-bold shadow-lg shadow-primary-light/20 transition-all disabled:opacity-50 flex items-center justify-center gap-2">
      <span *ngIf="isSaving" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
      {{ isSaving ? 'Salvando...' : 'Salvar Transação' }}
    </button>
  </div>
</form>
